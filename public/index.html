<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>24 Mantra Shopping Advisor</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f3f7f1;display:flex;flex-direction:column;height:100vh}
header{background:#2e7d32;color:#fff;padding:14px 18px;font-weight:600}
header small{display:block;font-weight:400;opacity:.85}
#log{flex:1;overflow-y:auto;padding:16px;max-width:760px;width:100%;margin:0 auto;box-sizing:border-box}
.m{margin:8px 0;padding:10px 14px;border-radius:12px;max-width:85%;white-space:pre-wrap;line-height:1.45}
.user{background:#c8e6c9;margin-left:auto}.assistant{background:#fff;box-shadow:0 1px 2px #0002}
a{color:#1b5e20}
#chips{max-width:760px;margin:0 auto;padding:0 16px;display:flex;flex-wrap:wrap;gap:6px;box-sizing:border-box;width:100%}
.chip{background:#fff;border:1px solid #2e7d32;color:#2e7d32;border-radius:16px;padding:6px 12px;cursor:pointer;font-size:14px}
form{display:flex;gap:8px;padding:12px;max-width:760px;width:100%;margin:0 auto;box-sizing:border-box}
input{flex:1;padding:12px;border:1px solid #bbb;border-radius:8px;font-size:16px}
button.send{padding:0 20px;background:#2e7d32;color:#fff;border:0;border-radius:8px;font-size:16px;cursor:pointer}
button:disabled{opacity:.5}
#new{float:right;background:#fff;color:#2e7d32;border:0;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}
</style></head><body>
<header><button id="new" type="button" title="Start a fresh conversation">+ New chat</button>24 Mantra Organic — Shopping Advisor<small>Simulated AI advisor, not an official representative. You make the final purchase decision. Chats are stored for a class project.</small></header>
<div id="log"></div>
<div id="chips"></div>
<form id="f"><input id="t" placeholder="Type your message…" autocomplete="off"><button class="send" id="b">Send</button></form>
<script>
let sid=localStorage.getItem("sid");
if(!sid){sid=crypto.randomUUID();localStorage.setItem("sid",sid)}
const log=document.getElementById("log"),t=document.getElementById("t"),b=document.getElementById("b"),chips=document.getElementById("chips");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function md(s){return esc(s).replace(/^#{1,4}\s*(.+)$/gm,"<b>$1</b>").replace(/^---+$/gm,"").replace(/^\s*[*-]\s+/gm,"• ")
  .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\*(.+?)\*/g,"<i>$1</i>")
  .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
  .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>')}
function add(role,text){const d=document.createElement("div");d.className="m "+role;
  role==="assistant"?d.innerHTML=md(text):d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
["Family of 4, ₹3000 monthly groceries","Gluten-free breakfast options","Healthy cooking oils & pulses","Gift ideas under ₹1000"]
  .forEach(s=>{const c=document.createElement("button");c.type="button";c.className="chip";c.textContent=s;c.onclick=()=>send(s);chips.appendChild(c)});
fetch("/api/history?sid="+sid).then(r=>r.json()).then(h=>{h.forEach(m=>add(m.role,m.content));if(h.length>1)chips.remove()});
async function send(msg){
  chips.remove();t.value="";b.disabled=true;add("user",msg);const w=add("assistant","…");
  try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sid,message:msg})});
    const j=await r.json();w.innerHTML=md(j.reply||j.detail||"Error")}
  catch{w.textContent="Network error, please retry."}
  b.disabled=false;t.focus();
}
document.getElementById("new").onclick=()=>{
  if(!confirm("Start a new chat? Your current conversation stays saved but won't be shown here."))return;
  localStorage.setItem("sid",crypto.randomUUID());location.reload()};
document.getElementById("f").onsubmit=e=>{e.preventDefault();const m=t.value.trim();if(m)send(m)};
</script></body></html>
